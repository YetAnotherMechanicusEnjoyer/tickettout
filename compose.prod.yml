services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cartepro
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://cartepro_app:cartepro_dev_password@postgres:5432/cartepro
      RUST_LOG: info
      AUDIT_EXPORT_KEY: cartepro_dev_audit_hmac_key
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18
    container_name: cartepro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cartepro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cartepro
    volumes:
      - postgres_prod_data:/var/lib/postgresql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cartepro -d cartepro"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_prod_data:
